<div class="register-page">
  <div class="register-container">
    <div class="register-card">
      <h1>Crear Cuenta</h1>
      <p class="register-subtitle">Únete para guardar tus vehículos favoritos</p>

      <form (ngSubmit)="register()" class="register-form">
        <div class="form-group">
          <label>Usuario</label>
          <input 
            type="text" 
            [(ngModel)]="username" 
            name="username"
            class="form-input"
            placeholder="Usuario"
            required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            class="form-input"
            placeholder="correo@ejemplo.com"
            required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input 
            type="password" 
            [(ngModel)]="password" 
            name="password"
            class="form-input"
            placeholder="Mínimo 6 caracteres"
            required>
        </div>

        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input 
            type="password" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword"
            class="form-input"
            placeholder="Confirma tu contraseña"
            required>
        </div>

        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>

        <button type="submit" class="register-button" [disabled]="isLoading">
          <span *ngIf="!isLoading">Registrarse</span>
          <span *ngIf="isLoading">Registrando...</span>
        </button>
      </form>

      <div class="login-link">
        <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
      </div>

      <div class="back-link">
        <a routerLink="/">← Volver al inicio</a>
      </div>
    </div>
  </div>
</div>
